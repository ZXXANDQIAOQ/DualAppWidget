apply plugin: 'com.android.application'

android {
    namespace 'com.example.dualappwidget'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.dualappwidget"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    /*
        两种身份，同一份代码，出两个 APK（包名、签名完全相同，可以互相覆盖安装）：

        - add   ：不加米系标识。桌面小部件面板里能找到它，用来「新建实例」。
        - stack ：补齐米系小部件声明（miuiWidget=true 等）。
                  桌面据此把它当米系小部件，两个实例可以拖到一起堆叠；
                  代价是它不会出现在小部件面板的列表里。

        小部件身份是桌面每次用 PackageManager 实时读当前安装包清单判断的，
        不是记录在实例里的 —— 所以两个包互相覆盖安装时，
        桌面上的实例和 App 里的配置都不会丢。
    */
    flavorDimensions "mode"
    productFlavors {
        // 名字不能叫 add —— 会和 Gradle 的 configurations.add() 撞名
        addable {
            dimension "mode"
            versionNameSuffix "-add"
            buildConfigField "boolean", "MIUI_STACK_MODE", "false"
        }
        stackable {
            dimension "mode"
            versionNameSuffix "-stack"
            buildConfigField "boolean", "MIUI_STACK_MODE", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        def mode = variant.productFlavors[0].name == 'addable' ? 'add' : 'stack'
        variant.outputs.all {
            outputFileName = "DualAppWidget-${mode}-${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Kotlin 1.8 起 kotlin-stdlib 已经吸收了 kotlin-stdlib-jdk7 / jdk8，
// 若同时存在旧版 jdk7/jdk8 会报 Duplicate class（checkDebugDuplicateClasses）。
// 本项目是纯 Java 工程，直接排除这两个过渡模块即可。
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
